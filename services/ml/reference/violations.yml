# Справочник нарушений. Коды соответствуют столбцам разметки организаторов (лист «Калибровка»).
# Тексты «как исправить» — черновик: подтвердить с врачом-рентгенологом команды.

SPINE_POSITIONING:
  region: spine
  severity: critical
  title_ru: Некорректная укладка позвоночника
  message_ru: Положение пациента при сканировании поясничного отдела не соответствует протоколу
  how_to_fix_ru: >-
    Уложить пациента на спину по центральной линии стола, ноги на подставке
    (бёдра под углом около 90°), чтобы уменьшить поясничный лордоз. Повторить сканирование.

SPINE_AXIS:
  region: spine
  severity: critical
  title_ru: Отклонение оси позвоночника
  message_ru: >-
    Модель считает, что ось позвоночника выведена с отклонением (эксперты отмечают это при наклоне более 5°).
    Наклон средней линии ниже — вспомогательная оценка по снимку, а не измерение аппарата.
  how_to_fix_ru: >-
    Выровнять пациента так, чтобы позвоночник проходил строго вертикально по центру поля.
    При выраженном сколиозе отметить это в протоколе.

SPINE_ARTIFACT:
  region: spine
  severity: critical
  title_ru: Посторонние предметы или артефакты
  message_ru: В поле сканирования есть посторонние предметы, выраженные артефакты или наложения
  how_to_fix_ru: >-
    Попросить пациента снять одежду с металлическими элементами (косточки бюстгальтера, пуговицы,
    молнии), убрать электроды и провода из зоны сканирования. Повторить сканирование.

SPINE_OTHER:
  region: spine
  severity: minor
  title_ru: Позвоночник требует проверки
  message_ru: >-
    Модель считает исследование позвоночника сомнительным, но не относит его к конкретному типу
    нарушения (например, сколиоз, аномалия числа позвонков, некорректная разметка)
  how_to_fix_ru: Передать исследование врачу-рентгенологу для проверки разметки позвонков.

HIP_ROTATION:
  region: hip
  severity: critical
  title_ru: Некорректная ротация бедра
  message_ru: Бедро не ротировано внутрь, малый вертел виден больше допустимого
  how_to_fix_ru: >-
    Развернуть ногу внутрь на 15–25° с помощью фиксатора стопы так, чтобы малый вертел был
    минимально виден, а диафиз шёл параллельно длинному краю поля. Повторить сканирование.

HIP_ROI:
  region: hip
  severity: critical
  title_ru: Некорректная область интересов бедра
  message_ru: Область интересов проксимального отдела бедра выставлена неверно
  how_to_fix_ru: >-
    Проверить положение ROI шейки бедра: она должна быть перпендикулярна оси шейки и не
    захватывать седалищную кость и большой вертел. Переставить ROI и пересчитать.

HIP_OTHER:
  region: hip
  severity: minor
  title_ru: Бедро требует проверки
  message_ru: >-
    Модель считает исследование бедра сомнительным, но не относит его к конкретному типу нарушения
  how_to_fix_ru: Передать исследование врачу-рентгенологу для проверки.
