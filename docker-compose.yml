# Весь стек одной командой: docker compose up --build
# Открыть: http://localhost:3000  (API: http://localhost:8000/docs)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # наружу только для локальной разработки
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  ml:
    build: ./services/ml
    environment:
      DATA_DIR: /data
    volumes:
      - studies:/data # общий том с core: DICOM не гоняем по HTTP
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      retries: 30

  core:
    build: ./services/core
    env_file: .env
    environment:
      # внутри compose адреса — имена сервисов, а не localhost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ML_SERVICE_URL: http://ml:8001
      DATA_DIR: /data
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      # демо-исследования при первом запуске (папка из датасета организаторов, если она есть)
      DEMO_SRC: /demo/Исследования
    volumes:
      - studies:/data
      - ./data/train:/demo:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - core

volumes:
  db_data:
  studies:
